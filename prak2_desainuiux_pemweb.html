<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Form Pemesanan Barang</title>
</head>
<body>

<nav>
  <table border="1" width="100%" cellpadding="6" cellspacing="0">
    <tr>
      <td align="center">
        <a>Beranda</a> |
        <a>Membuat Link</a> |
        <a>Riwayat Transaksi</a> |
        <a>Kebijakan</a> |
        <a>Tata Letak</a>
      </td>
    </tr>
  </table>
</nav>
<br>

<form action="" method="get">
<table border="0" cellpadding="6" cellspacing="0">

  <tr>
    <td rowspan="10" valign="top" align="center">
      <img src="Shopping cart silhouette vector illustration _ Premium Vector.jpeg" alt="Foto Barang" width="200" height="200"><br><br>
      <input type="file" name="foto" accept="image/*">
    </td>
    <td align="right"><label for="judul">Nama Barang :</label></td>
    <td><input type="text" id="judul" name="judul" size="40"></td>
  </tr>

  <tr>
    <td align="right" valign="top"><label for="deskripsi">Deskripsi Produk :</label></td>
    <td><textarea id="deskripsi" name="deskripsi" rows="5" cols="38"></textarea></td>
  </tr>

  <tr>
    <td align="right"><label for="rekening">Nomor Rekening :</label></td>
    <td><input type="text" id="rekening" name="rekening" size="40"></td>
  </tr>

  <tr>
    <td align="right"><label for="bank">Bank :</label></td>
    <td>
      <select id="bank" name="bank">
        <option value="btn" selected>BTN</option>
        <option value="bca">BCA</option>
        <option value="mandiri">Mandiri</option>
        <option value="bni">BNI</option>
        <option value="bri">BRI</option>
      </select>
    </td>
  </tr>

  <tr>
    <td align="right"><label for="pemilik">Pemegang Akun :</label></td>
    <td><input type="text" id="pemilik" name="pemilik" size="30" placeholder="Masukkan nama"></td>
  </tr>

  <tr>
    <td align="right"><label for="transaksi">Transaksi :</label></td>
    <td><input type="number" id="transaksi" name="transaksi" min="1" max="10" value="1"></td>
  </tr>

  <tr>
    <td colspan="2">
      <small>* jika transaksi untuk 3 orang, pilih 3 dari daftar drop-down</small><br>
      <input type="checkbox" id="kirim_hp" name="kirim_hp" checked>
      <label for="kirim_hp">Kirim ke nomor telepon</label><br>
      <input type="checkbox" id="kirim_email" name="kirim_email" checked>
      <label for="kirim_email">Kirim ke email</label>
    </td>
  </tr>

  <tr>
    <td align="right"><label for="hp">Kirim ke Telepon :</label></td>
    <td><input type="text" id="hp" name="hp" size="40"></td>
  </tr>

  <tr>
    <td align="right"><label for="email">Kirim ke Email :</label></td>
    <td><input type="text" id="email" name="email" size="40"></td>
  </tr>

  <tr>
    <td></td>
    <td><button type="submit">Tekan Untkuk Membuat Pesanan</button></td>
  </tr>

</table>
</form>

</body>
</html>
